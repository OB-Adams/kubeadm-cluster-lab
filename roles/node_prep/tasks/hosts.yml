---
- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Add every cluster node to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} kubeadm-cluster-lab nodes"
    block: |
      {% for host in groups['k8s_cluster'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endfor %}
    mode: "0644"
